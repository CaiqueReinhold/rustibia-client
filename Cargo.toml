[package]
name = "rustibia-client"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["crates/*"]

[dependencies]
bevy_text_outline = { path = "crates/bevy_text_outline" }
async-channel = "2.5.0"
async-net = "2.0.0"
asynchronous-codec = "0.7.0"
bevy = { version = "0.18", features = ["debug", "experimental_bevy_ui_widgets"] }
bevy_asset_loader = "0.25"
bytes = "1.11.1"
futures = "0.3.32"
futures-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "logging"] }
rustls-platform-verifier = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
pathfinding = "4.15.0"
bevy_ui_text_input = "0.7"
# Same version bevy_ui_text_input resolves to; needed only for the `Edit`
# trait to read the cursor position out of `TextInputBuffer.editor`.
cosmic-text = "0.16"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# `blocking` carries its own tokio runtime on a background thread; the async
# client would panic on Bevy's IoTaskPool, which has no tokio reactor.
reqwest = { version = "0.13.4", features = ["json", "blocking"] }
serde_yaml = "0.9"
smallvec = "1.15.1"
# Per-phase animation durations that carry a [min, max] range are sampled, so a
# room full of torches does not flicker in lockstep. No transitive dependencies.
fastrand = "2.3"

[features]
debug = []

[profile.release]
opt-level = 3

[profile.release.package.rustibia-client]
debug-assertions = true

[profile.production]
inherits = "release"
lto = "fat"
codegen-units = 1

[profile.production.package.rustibia-client]
debug-assertions = false

[build-dependencies]
winresource = "0.1.31"
